# Copy to config.toml (git-ignored). No secrets in this file.
# Windows paths: use forward slashes or single quotes, e.g. data_dir = 'D:\arbdesk-data'

[scan]
# US residents: binance/okx/bybit don't serve the US. US-available ccxt ids:
# exchanges = ["coinbase", "kraken", "gemini", "binanceus"]
exchanges = ["binance", "okx", "bybit", "gate", "kucoin"]   # ccxt ids
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "DOGE/USDT"]
times = ["08:00", "14:00", "20:00"]      # local time, daily
taker_fee_pct = 0.1                      # per fill
min_net_spread_pct = 0.2                 # cross-exchange, after fees
min_funding_apr_pct = 10.0
triangular_exchange = "binance"
triangular_min_profit_pct = 0.05

[risk]
mode = "paper"                 # "paper" until you trust it; then "live"
max_capital_usd = 150
max_per_trade_usd = 30
daily_loss_limit_usd = 10
max_trades_per_day = 5
max_slippage_pct = 0.3
allow_live_swap = false        # perpetuals in live mode
allowed_symbols = []           # empty = same as scan.symbols

[llm]
enabled = true
max_calls_per_day = 10
temperature = 0.2

[panel]
host = "127.0.0.1"             # loopback only; enforced
port = 8765

[polymarket]                   # polymarket.com (international). NOT available to US residents.
enabled = true                 # US users: set false (or keep for paper research only)
max_events = 200               # top events by 24h volume
min_liquidity_usd = 5000       # for AI forecast candidates
taker_fee_rate = 0.07          # fee/share = rate * p * (1-p); conservative, check official docs
min_arb_profit_pct = 0.5       # negRisk bundle must clear this after fees
max_usd_per_market = 20
ai_markets_per_run = 8
ai_min_edge = 0.08             # AI prob must beat price + fee by this much to propose
ai_horizon_days = [1, 60]
# --- real money (needs: vault with POLYMARKET_PRIVATE_KEY, pip install -r requirements-live.txt) ---
mode = "paper"                 # "live" sends real orders after you type LIVE to confirm each one
max_live_usd_per_day = 20
max_live_exposure_usd = 50     # total cost of unresolved live positions
price_tolerance = 0.01         # max price above the proposal's limit (FOK orders)

# ---------------------------------------------------------------------------
# Kalshi — CFTC-regulated, available in most US states (incl. South Carolina).
# Live keys: kalshi.com -> Account -> API keys. Store in the vault:
#   python -m arbdesk vault set KALSHI_API_KEY_ID
#   python -m arbdesk vault set-file KALSHI_PRIVATE_KEY path/to/kalshi-key.pem
[kalshi]
enabled = true
environment = "demo"           # "demo" = fake money on demo.kalshi.co (separate demo account + keys);
                               # switch to "prod" only after demo works end to end
mode = "paper"                 # "live" sends FOK orders to `environment`, after you type LIVE
max_events = 200
min_liquidity_usd = 500        # open interest (contracts) for AI forecast candidates
taker_fee_rate = 0.07          # fee = ceil(0.07 * C * P * (1-P)) per order; some series differ
min_arb_profit_pct = 0.5
max_usd_per_market = 20
ai_markets_per_run = 8
ai_min_edge = 0.08
ai_horizon_days = [1, 60]
max_live_usd_per_day = 20
max_live_exposure_usd = 50
price_tolerance = 0.01

# ---------------------------------------------------------------------------
# Polymarket US — CFTC-regulated app (separate from polymarket.com), KYC in the app.
# API keys: polymarket.us/developer. Store in the vault:
#   python -m arbdesk vault set POLYMARKET_US_KEY_ID
#   python -m arbdesk vault set POLYMARKET_US_SECRET_KEY
# Live orders only buy YES (long); no automatic bundle arbitrage on this venue.
[polymarket_us]
enabled = true
mode = "paper"
max_events = 200
min_liquidity_usd = 1000
taker_fee_rate = 0.07          # conservative placeholder; check Polymarket US fee schedule
max_usd_per_market = 20
ai_markets_per_run = 8
ai_min_edge = 0.08
ai_horizon_days = [1, 60]
max_live_usd_per_day = 20
max_live_exposure_usd = 50
price_tolerance = 0.01
