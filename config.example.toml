# Copy to config.toml (git-ignored). No secrets in this file.
# Windows paths: use forward slashes or single quotes, e.g. data_dir = 'D:\arbdesk-data'

[scan]
# US residents: binance/okx/bybit don't serve the US. US-available ccxt ids:
# exchanges = ["coinbase", "kraken", "gemini", "binanceus"]
exchanges = ["binance", "okx", "bybit", "gate", "kucoin"]   # ccxt ids
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "DOGE/USDT"]
interval_minutes = 5           # code-only scans (no AI tokens): crypto + prediction markets
taker_fee_pct = 0.1                      # per fill
min_net_spread_pct = 0.2                 # cross-exchange, after fees
min_funding_apr_pct = 10.0
triangular_exchange = "binance"
triangular_min_profit_pct = 0.05

[risk]
mode = "paper"                 # "paper" until you trust it; then "live"
max_capital_usd = 150
max_per_trade_usd = 30
daily_loss_limit_usd = 10
max_trades_per_day = 5
max_slippage_pct = 0.3
allow_live_swap = false        # perpetuals in live mode
allowed_symbols = []           # empty = same as scan.symbols

[llm]
enabled = true
interval_minutes = 60          # AI runs at most hourly, and only when something changed
daily_token_budget = 300000    # input + output tokens per UTC day; AI pauses when reached
monthly_usd_cap = 5.0          # estimated monthly spend cap (uses the prices below)
max_calls_per_day = 200
temperature = 0.2
# USD per 1M tokens for the cost estimate; 0 = provider preset
# (deepseek-flash 0.30 / 0.006 cached / 1.20; qwen-flash 0.05 / 0.005 / 0.40).
# Check your provider's pricing page and put the exact numbers here.
price_input = 0
price_cached_input = 0
price_output = 0
reforecast_price_move = 0.05   # re-forecast a market only after a 5-point move...
reforecast_hours = 24          # ...or once a day

[crossvenue]                   # same event on Kalshi and Polymarket US
enabled = true
venues = ["kalshi", "polymarket_us"]
min_similarity = 0.35          # code pre-filter on title words (no tokens)
max_end_date_diff_days = 3
max_new_pairs_per_run = 15     # new pairs the AI judges per hourly run (each judged once, cached)
min_match_confidence = 0.8
min_profit_pct = 1.0           # extra margin: two venues' rules can differ
max_usd_per_pair = 20

[panel]
host = "127.0.0.1"             # loopback only; enforced
port = 18765                   # change if another app already uses this port

[polymarket]                   # polymarket.com (international). NOT available to US residents.
enabled = true                 # US users: set false (or keep for paper research only)
max_events = 200               # top events by 24h volume
min_liquidity_usd = 5000       # for AI forecast candidates
taker_fee_rate = 0.07          # fee/share = rate * p * (1-p); conservative, check official docs
min_arb_profit_pct = 0.5       # negRisk bundle must clear this after fees
max_usd_per_market = 20
ai_markets_per_run = 8
ai_min_edge = 0.08             # AI prob must beat price + fee by this much to propose
ai_horizon_days = [1, 60]
# --- real money (needs: vault with POLYMARKET_PRIVATE_KEY, pip install -r requirements-live.txt) ---
mode = "paper"                 # "live" sends real orders after you type LIVE to confirm each one
max_live_usd_per_day = 20
max_live_exposure_usd = 50     # total cost of unresolved live positions
price_tolerance = 0.01         # max price above the proposal's limit (FOK orders)

# ---------------------------------------------------------------------------
# Kalshi — CFTC-regulated, available in most US states (incl. South Carolina).
# Live keys: kalshi.com -> Account -> API keys. Store in the vault:
#   python -m arbdesk vault set KALSHI_API_KEY_ID
#   python -m arbdesk vault set-file KALSHI_PRIVATE_KEY path/to/kalshi-key.pem
[kalshi]
enabled = true
environment = "demo"           # "demo" = fake money on demo.kalshi.co (separate demo account + keys);
                               # switch to "prod" only after demo works end to end
mode = "paper"                 # "live" sends FOK orders to `environment`, after you type LIVE
max_events = 200
min_liquidity_usd = 500        # open interest (contracts) for AI forecast candidates
taker_fee_rate = 0.07          # fee = ceil(0.07 * C * P * (1-P)) per order; some series differ
min_arb_profit_pct = 0.5
max_usd_per_market = 20
ai_markets_per_run = 8
ai_min_edge = 0.08
ai_horizon_days = [1, 60]
max_live_usd_per_day = 20
max_live_exposure_usd = 50
price_tolerance = 0.01

# ---------------------------------------------------------------------------
# Polymarket US — CFTC-regulated app (separate from polymarket.com), KYC in the app.
# API keys: polymarket.us/developer. Store in the vault:
#   python -m arbdesk vault set POLYMARKET_US_KEY_ID
#   python -m arbdesk vault set POLYMARKET_US_SECRET_KEY
# Live orders only buy YES (long); no automatic bundle arbitrage on this venue.
[polymarket_us]
enabled = true
mode = "paper"
max_events = 200
min_liquidity_usd = 1000
taker_fee_rate = 0.07          # conservative placeholder; check Polymarket US fee schedule
max_usd_per_market = 20
ai_markets_per_run = 8
ai_min_edge = 0.08
ai_horizon_days = [1, 60]
max_live_usd_per_day = 20
max_live_exposure_usd = 50
price_tolerance = 0.01

# ---------------------------------------------------------------------------
# Black-swan tickets: BTC/ETH price contracts on Kalshi / Polymarket US priced
# against Deribit's option chain (public data only). Code only, no AI tokens.
[tail]
enabled = true
currencies = ["BTC", "ETH"]
venues = ["kalshi", "polymarket_us"]
kalshi_series = ["KXBTCD", "KXBTC", "KXETHD", "KXETH"]   # Kalshi crypto series to scan
max_price = 0.15               # only sides costing <= 15 cents ("lottery tickets")
min_hours_to_expiry = 24       # skip intraday / same-day contracts (index & timing mismatch dominate)
min_distance_pct = 5           # strike(s) at least 5% away from the current price: real tails only
min_edge = 0.02                # option-implied probability - price - fee
min_ratio = 1.5                # option-implied probability / price
max_expiry_gap_days = 45       # contract date must be near a listed option expiry
max_usd_per_bet = 5
quarterly_budget_usd = 30      # hard cap on all tail bets per calendar quarter (paper and live)
max_pmus_quotes = 40

# ---------------------------------------------------------------------------
# Extreme-market alerts: checked with every 5-minute scan, no trading, no AI tokens.
[alerts]
enabled = true
currencies = ["BTC", "ETH"]
move_1h_pct = 5               # warning at a 5% move within 1 hour...
critical_move_1h_pct = 12     # ...critical at 12%
move_24h_pct = 12
iv_high = 1.0                 # at-the-money implied vol >= 100%
iv_jump_points = 0.20         # +20 vol points vs 24 hours ago
funding_8h_abs = 0.0015       # perpetual funding beyond +/-0.15% per 8h
stablecoins = ["USDT/USD", "USDC/USD"]
stable_exchange = "kraken"
depeg_pct = 0.5               # warning beyond 0.5% off $1...
critical_depeg_pct = 2.0      # ...critical beyond 2%
outage_consecutive = 3        # a working source failing 3 scans in a row
cooldown_hours = 6            # same alert isn't repeated within 6 h unless it escalates
desktop_notify = true         # Windows pop-up (needs plyer, installed by requirements.txt)
halt_on_critical = true       # critical alert engages the kill switch if any live mode is on

# ---------------------------------------------------------------------------
# Dip-buy ladder: resting limit buys far below the market (spot, no leverage, no auto-sell).
# Paper mode simulates fills from 1-minute candle lows and arms itself.
# Live: put exchange keys in the vault (trade permission only, withdrawals OFF), set
# mode = "live", then arm with `python -m arbdesk dip arm --live` (type LIVE) or the panel.
[dip]
enabled = true
mode = "paper"
exchange = "coinbase"          # US-available, low minimum order size
max_open_usd = 30              # all resting dip orders together
quarterly_budget_usd = 60      # filled + resting per calendar quarter
rearm_pct = 10                 # ladder moves up after a 10% rise (never down)
maker_fee_pct = 0.6            # paper-fill fee estimate; check your fee tier
auto_arm_paper = true
keep_orders_on_auto_halt = true   # alert-triggered halt keeps dip orders; manual halt cancels them

[[dip.ladders]]
symbol = "BTC/USD"
levels_pct = [-25, -40, -55]
usd_per_level = 5

[[dip.ladders]]
symbol = "ETH/USD"
levels_pct = [-30, -45, -60]
usd_per_level = 5

# ---------------------------------------------------------------------------
# Simulated account: `python -m arbdesk sim start --capital 150 --hours 24`, or the panel button.
# During a session, paper proposals that pass the risk checks are executed automatically
# (live never is), against the session's cash; resting dip orders reserve cash.
[sim]
capital = 150
hours = 24
auto_execute = true
